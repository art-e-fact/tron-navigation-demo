project: artefacts/tron-navigation-demo
version: 0.1.0

jobs:
  basic_test:
    type: test
    timeout: 15 # minutes
    package:
      docker:
        build:
          dockerfile: empty
    runtime:
      framework: ros2:humble
      simulator: newton

    scenarios:
      defaults:
        params:
          headless: "false"
          rviz: "false"
      settings:
        - name: test_route_navigation
          pytest_file: tests/test_route.py
